fetch_history:
  name: Fetch history
  description: Fetches historical hourly data from the Energa API.
  fields:
    start_date:
      name: Start date
      description: Date to start fetching from (format YYYY-MM-DD).
      required: true
      selector:
        text:
    days:
      name: Number of days
      description: How many days to fetch (default 30).
      required: false
      default: 30
      selector:
        number:
          min: 1
          max: 365

generate_dashboard:
  name: Generate dashboard
  description: Generates or refreshes a dedicated Lovelace dashboard for Energa meters.
  fields:
    url_path:
      name: URL Path
      description: URL slug for the dashboard (e.g. energa-rachunek).
      required: false
      default: "energa-rachunek"
      selector:
        text:
    title:
      name: Title
      description: Title of the dashboard in sidebar.
      required: false
      default: "Energa Rozliczenia"
      selector:
        text:
    icon:
      name: Icon
      description: Icon in sidebar (e.g. mdi:currency-pln).
      required: false
      default: "mdi:currency-pln"
      selector:
        icon:
    meter_id:
      name: Meter ID / Serial
      description: Optional serial or ID to generate only for a single meter.
      required: false
      selector:
        text:

reconcile_invoice:
  name: Reconcile invoice
  description: Performs per-line audit reconciliation comparing seller invoice against canonical calculation.
  fields:
    invoice_number:
      name: Invoice Number
      description: Unique identifier of the seller invoice (e.g. 1200222768/FES/00017).
      required: true
      selector:
        text:
    period_start:
      name: Period start
      description: Billing period start date (YYYY-MM-DD).
      required: true
      selector:
        text:
    period_end:
      name: Period end
      description: Billing period end date (YYYY-MM-DD).
      required: true
      selector:
        text:
    tariff:
      name: Tariff code
      description: Tariff plan (G11 or G12w).
      required: false
      default: "G11"
      selector:
        text:
    consumption_kwh:
      name: Consumption (kWh)
      description: Total billed kWh for G11.
      required: false
      default: 0.0
      selector:
        number:
          min: 0
          step: 0.01
    months:
      name: Number of months
      description: Billing duration in months (e.g. 2.0).
      required: false
      default: 1.0
      selector:
        number:
          min: 0.1
          step: 0.1
    invoiced_gross:
      name: Invoiced gross (PLN)
      description: Total gross amount printed on the invoice header.
      required: false
      selector:
        number:
          min: 0
          step: 0.01
    ppe_id:
      name: PPE ID
      description: Optional PPE point code.
      required: false
      selector:
        text:


