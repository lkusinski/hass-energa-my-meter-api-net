fetch_history:
  name: Fetch history
  description: Fetches historical hourly data from the Energa API.
  fields:
    start_date:
      name: Start date
      description: Date to start fetching from (format YYYY-MM-DD).
      required: true
      selector:
        text:
    days:
      name: Number of days
      description: How many days to fetch (default 30).
      required: false
      default: 30
      selector:
        number:
          min: 1
          max: 365
    meter_id:
      name: Meter ID / Serial
      description: Optional serial or point ID to fetch only for a single meter.
      required: false
      selector:
        text:

generate_dashboard:
  name: Generate dashboard
  description: Generates or refreshes a dedicated Lovelace dashboard for Energa meters.
  fields:
    url_path:
      name: URL Path
      description: URL slug for the dashboard (e.g. energa-rachunek).
      required: false
      default: "energa-rachunek"
      selector:
        text:
    title:
      name: Title
      description: Title of the dashboard in sidebar.
      required: false
      default: "Energa Rozliczenia"
      selector:
        text:
    icon:
      name: Icon
      description: Icon in sidebar (e.g. mdi:currency-pln).
      required: false
      default: "mdi:currency-pln"
      selector:
        icon:
    meter_id:
      name: Meter ID / Serial
      description: Optional serial or ID to generate only for a single meter.
      required: false
      selector:
        text:

reconcile_invoice:
  name: Reconcile invoice
  description: Performs per-line audit reconciliation comparing seller invoice against canonical calculation.
  fields:
    invoice_number:
      name: Invoice Number
      description: Unique identifier of the seller invoice (e.g. FES/00017).
      required: true
      selector:
        text:
    period_start:
      name: Period start
      description: Billing period start date (YYYY-MM-DD).
      required: true
      selector:
        text:
    period_end:
      name: Period end
      description: Billing period end date (YYYY-MM-DD).
      required: true
      selector:
        text:
    tariff:
      name: Tariff code
      description: Tariff plan (G11 or G12w).
      required: false
      default: "G11"
      selector:
        text:
    consumption_kwh:
      name: Consumption (kWh)
      description: Total billed kWh for G11.
      required: false
      default: 0.0
      selector:
        number:
          min: 0
          step: 0.01
    day_kwh:
      name: Day zone consumption (kWh)
      description: Optional L1 (day) kWh for G12w. When omitted, consumption_kwh is split 50/50.
      required: false
      selector:
        number:
          min: 0
          step: 0.01
    night_kwh:
      name: Night zone consumption (kWh)
      description: Optional L2 (night) kWh for G12w.
      required: false
      selector:
        number:
          min: 0
          step: 0.01
    months:
      name: Number of months
      description: Billing duration in months (e.g. 2.0).
      required: false
      default: 1.0
      selector:
        number:
          min: 0.1
          step: 0.1
    invoiced_gross:
      name: Invoiced gross (PLN)
      description: Total gross amount printed on the invoice header.
      required: false
      selector:
        number:
          min: 0
          step: 0.01
    invoiced_lines:
      name: Invoiced lines
      description: Optional list of invoice line items to compare against the computed lines.
      required: false
      selector:
        object:
    ppe_id:
      name: PPE ID
      description: Optional PPE point code.
      required: false
      selector:
        text:

verify_period:
  name: Verify period
  description: >-
    Recomputes a full Energa invoice for an arbitrary [start, end] period and
    returns the breakdown as a service response. Prefers the Energa API for
    historical periods when a meter_id is supplied, falling back to hourly
    recorder statistics. The response reports source (energa_api /
    recorder_hourly) and cached.
  fields:
    start:
      name: Period start
      description: First day of the period (YYYY-MM-DD or ISO datetime).
      required: true
      selector:
        date:
    end:
      name: Period end
      description: Last day of the period, inclusive (YYYY-MM-DD or ISO datetime).
      required: true
      selector:
        date:
    entry_id:
      name: Config entry ID
      description: Optional config entry; defaults to the first Energa entry.
      required: false
      selector:
        text:
    meter_id:
      name: Meter ID / Serial
      description: Optional meter serial or point id when the account has several.
      required: false
      selector:
        text:
    rcem_pln:
      name: RCEm (PLN/kWh)
      description: >-
        Market price used to value export. Defaults to the coordinator cache,
        then Options, then the last-known value.
      required: false
      selector:
        number:
          min: 0
          step: "any"
    rcem:
      name: RCEm (PLN/kWh, alias)
      description: Alias of rcem_pln.
      required: false
      selector:
        number:
          min: 0
          step: "any"
    bank_open_1:
      name: Opening bank L1 (kWh)
      description: Optional manual opening balance of the net-metering warehouse for zone 1.
      required: false
      selector:
        number:
          min: 0
          step: "any"
    bank_open_2:
      name: Opening bank L2 (kWh)
      description: Optional manual opening balance of the net-metering warehouse for zone 2.
      required: false
      selector:
        number:
          min: 0
          step: "any"
    deposit_open_pln:
      name: Opening deposit (PLN)
      description: Optional manual opening balance of the prosumer deposit in PLN.
      required: false
      selector:
        number:
          min: 0
          step: "any"

clear_period:
  name: Clear period
  description: >-
    Clears the saved verification period dates (verify_period_start /
    verify_period_end) stored in the config entry options, so the invoice
    calculator starts clean after a test period was selected.
  fields:
    entry_id:
      name: Config entry ID
      description: Optional config entry; defaults to the first Energa entry.
      required: false
      selector:
        text:


