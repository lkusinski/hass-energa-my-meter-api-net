name: Release

# UWAGA: release'y tego repozytorium tworzy WYŁĄCZNIE ten workflow (push tagu `v*`).
# NIE tworzyć release'ów ręcznie przez API/UI — powodowało to konflikt "already exists"
# przy ponownym uruchomieniu workflow dla tego samego tagu.

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements_test.txt

      - name: Run tests
        run: |
          python -m pytest tests/ -v --tb=short

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: false
          prerelease: ${{ contains(github.ref_name, '-beta') || contains(github.ref_name, '-rc') || contains(github.ref_name, '-alpha') }}
          make_latest: ${{ !contains(github.ref_name, '-') }}
